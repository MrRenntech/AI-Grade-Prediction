<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Performance Early Warning System</title>

    <style>
        :root {
            --primary: #1e3a5f;
            --secondary: #f4f6f9;
            --border: #dcdfe4;
            --text: #2b2e34;
            --muted: #6b7280;

            --low: #1f7a3f;
            --medium: #b58900;
            --high: #a61b1b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--secondary);
            color: var(--text);
        }

        header {
            background: var(--primary);
            color: #ffffff;
            padding: 22px 40px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 500;
        }

        header p {
            margin: 4px 0 0;
            font-size: 13px;
            opacity: 0.9;
        }

        .container {
            max-width: 960px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 28px;
            margin-bottom: 30px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 9px;
            margin-top: 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            margin-top: 26px;
            padding: 12px;
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }

        button:hover {
            background: #162c48;
        }

        .result-card {
            border-left: 6px solid;
        }

        .low {
            border-color: var(--low);
        }

        .medium {
            border-color: var(--medium);
        }

        .high {
            border-color: var(--high);
        }

        .risk-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .meta {
            font-size: 14px;
            margin: 6px 0;
        }

        .section-title {
            margin-top: 18px;
            font-size: 14px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
        }

        footer {
            text-align: center;
            padding: 18px;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>

<body>

    <header>
        <h1>AI-Based Student Performance Early Warning System</h1>
        <p>Decision Support Tool for Academic Advisors and Institutions</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Student Academic Profile</h2>

            <div class="grid">
                <div>
                    <label>Student Age</label>
                    <input type="number" id="age" value="17">
                </div>

                <div>
                    <label>Study Time (Scale 1–4)</label>
                    <input type="number" id="studytime" value="2">
                </div>

                <div>
                    <label>Total Absences</label>
                    <input type="number" id="absences" value="4">
                </div>

                <div>
                    <label>Average Internal Assessment Score</label>
                    <input type="number" id="G1_G2_AVG" value="12">
                </div>
            </div>

            <button onclick="predict()">Run Risk Assessment</button>
        </div>

        <div id="output"></div>

    </div>

    <footer>
        AI-Driven Academic Risk Assessment • Advisory Use Only • Human-in-the-Loop System
    </footer>

    <script>
        function predict() {
            const payload = {
                age: Number(document.getElementById("age").value),
                studytime: Number(document.getElementById("studytime").value),
                absences: Number(document.getElementById("absences").value),
                G1_G2_AVG: Number(document.getElementById("G1_G2_AVG").value)
            };

            fetch("/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
                .then(res => res.json())
                .then(data => {
                    const p = data.prediction;
                    let cls = "low";
                    if (p.risk_level === "HIGH RISK") cls = "high";
                    else if (p.risk_level === "MEDIUM RISK") cls = "medium";

                    document.getElementById("output").innerHTML = `
            <div class="card result-card ${cls}">
                <div class="risk-title">${p.risk_level}</div>

                <div class="meta"><b>Risk Score:</b> ${p.risk_score}</div>
                <div class="meta"><b>Confidence Level:</b> ${p.confidence}</div>

                <div class="section-title">Recommended Action</div>
                <div class="meta">${p.recommended_action}</div>

                <div class="section-title">Model Probability Distribution</div>
                <div class="meta">Low Risk: ${data.probabilities.low_risk}</div>
                <div class="meta">Medium Risk: ${data.probabilities.medium_risk}</div>
                <div class="meta">High Risk: ${data.probabilities.high_risk}</div>
            </div>
        `;
                })
                .catch(() => {
                    document.getElementById("output").innerHTML =
                        "<div class='card'>Prediction error. Please verify inputs.</div>";
                });
        }
    </script>

</body>

</html>
